name: Bug report
description: Something did not work as expected.
body:
  - type: markdown
    attributes:
      value: For a security problem, follow [SECURITY.md](https://github.com/asasemahmed/openboard/blob/main/SECURITY.md) instead of opening a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Leave out secrets and private board content.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: If you know it. Operating system, Node.js version (`node --version`), and the agent you used, if any.
      placeholder: macOS 15, Node 22.11, Cursor
