name: Feature request
description: Suggest something OpenBoard should do.
body:
  - type: markdown
    attributes:
      value: Not sure yet, or want to talk it through first? Start a [discussion](https://github.com/asasemahmed/openboard/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: Optional. An idea of the change, or how other tools do it.
