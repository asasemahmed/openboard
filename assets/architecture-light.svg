<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="How OpenBoard works: agents connect over MCP and people over WebSocket to one local server that owns the board document and saves it as a file in the repository">
